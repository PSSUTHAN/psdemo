<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <form action="thank.html" method="get">
        <h1>Form Page</h1>
        <p>Please fill out the form below:</p>
        <label for="username">Enter your firstname : </label>

        <input type="text" id="username">
        <div style="margin-top: 10px;"><label for ="last">Enter the lastname : </label>
        <input type="text" id="last"></div>

        <div style="margin-top: 10px;"><label for ="dep">Enter the department : </label>
        <select name="dep" id="dep">
            <option value="IT">IT</option>
            <option value="AIDS">AIDS</option>
            <option value="CSE">CSE</option>
        </select></div>

        <div style="margin-top: 10px;"><label for ="roll">Enter the roll number : </label>
        <input type="text" id="roll" required></div>

        <div style="margin-top: 10px;"><label for ="mail">Enter the Email: </label>
        <input type="text" id="mail" required></div>

        <div style="margin-top: 10px;"><label for ="doi">Enter the SOI : </label>
        <select name="soi" id="soi">
            <option value="FW">Full stack</option>
            <option value="CYS">Cyber Security</option>
            <option value="BW">Blochchain</option>
        </select></div>

        <div style="margin-top: 10px;"><label for="Year">Select the year : </label>
        <label><input type="radio" name="Year" value="1st Year" id="1stYear" style="margin-top: 10px;">2022</label>
        <label><input type="radio" name="Year" value="1st Year" id="1stYear" style="margin-top: 10px;">2023</label>
        <label><input type="radio" name="Year" value="1st Year" id="1stYear" style="margin-top: 10px;">2024</label></div>

        <label><input type="checkbox" id="agree" style="margin-top: 10px;">Given data is correct</label>

        <div><label for="pass">Password</label>
        <input type="password" id="pass" style="margin-top: 10px;"></div>

        <input type="submit" value="Submit" style="margin-top: 10px; margin-left: 10px;">

        <input type="reset" value="Reset" style="margin-top: 10px; margin-left: 10px;">
        <div style="margin-top: 10px;">
        <div><a href="index.html">Go to Index Page</a></div>
    </form>
    
</body>
</html>
